<div class="bra-article">
<style>
.bra-article{max-width:760px;margin:0 auto;}
.bra-article .bra-title{font-size:1.6em;font-weight:800;color:#2f3a1c;margin-bottom:.5em;}
.bra-article .bra-image img{width:100%;height:auto;border-radius:10px;border:1px solid #d9dcc3;margin-bottom:1em;}
.bra-article .bra-content{line-height:1.9;color:#2a2a2a;font-size:1.02em;}
.bra-article .bra-content p{margin:0 0 1.4em;}
.bra-article .bra-content ul,.bra-article .bra-content ol{margin:0 0 1.4em;padding-left:1.4em;}
.bra-article .bra-content li{margin:0 0 .6em;}
.bra-article .bra-content strong{color:#173a63;}

/* 参考ページに寄せた見出しスタイル: 左に太いカラーバー + 淡色の背景ボックス */
.bra-article .bra-content h2{
    background:#eaf2fc;border-left:6px solid #2454a0;border-radius:6px;
    padding:16px 20px;margin:2.2em 0 1em;font-size:1.3em;font-weight:800;
    color:#122a45;line-height:1.5;
}
.bra-article .bra-content h2:first-child{margin-top:0;}

/* 見出しの強調バリエーション: 濃色の帯(白文字)。h3 に使う想定 */
.bra-article .bra-content h3{
    background:#0f6b5f;color:#fff;border-radius:6px;
    padding:14px 20px;margin:2em 0 1em;font-size:1.12em;font-weight:800;line-height:1.5;
}

/* 定義・補足を目立たせたい時に、段落に "bra-callout" クラスを付けると使える淡色ボックス */
.bra-article .bra-content .bra-callout{
    background:#eaf2fc;border-radius:8px;padding:16px 20px;margin:0 0 1.4em;
}

.bra-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.bra-list-item{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #d9dcc3;border-radius:10px;overflow:hidden;}
.bra-list-thumb img{width:100%;height:150px;object-fit:cover;display:block;}
.bra-list-body{padding:12px 14px;}
.bra-list-title{font-size:1.05em;font-weight:700;margin:0 0 6px;color:#2f3a1c;}
.bra-list-excerpt{font-size:.9em;color:#5a6242;margin:0;}
.bra-error,.bra-empty{color:#b05c2e;font-size:.9em;}
</style>

<h1 class="bra-title">【コラムのタイトルを入力】</h1>

<div class="bra-image">
  <img src="【アイキャッチ画像のURLを入力】" alt="【画像の説明を入力】">
</div>

<div class="bra-content">

  <p>【リード文。この記事で何を伝えるか、2〜3文でまとめる】</p>

  <h2>【見出し1(通常の章タイトル)】</h2>
  <p>【本文】</p>
  <ul>
    <li>【ポイント1】</li>
    <li>【ポイント2】</li>
    <li>【ポイント3】</li>
  </ul>

  <h3>【強調したい小見出し(帯付き)】</h3>
  <p>【本文。この見出しは h2 より目立たせたい補足テーマに使う】</p>

  <p class="bra-callout">
    <strong>【補足・用語の定義など】</strong><br>
    【箱で強調したい説明文をここに入れる】
  </p>

  <h2>【見出し2】</h2>
  <p>【本文】</p>

  <h2>【まとめ】</h2>
  <p>【記事全体のまとめ】</p>

</div>

<div class="bra-list">
  <a class="bra-list-item" href="#">
    <div class="bra-list-thumb">
      <img src="【関連記事1のサムネイルURL】" alt="">
    </div>
    <div class="bra-list-body">
      <p class="bra-list-title">【関連記事1のタイトル】</p>
      <p class="bra-list-excerpt">【関連記事1の抜粋】</p>
    </div>
  </a>
  <a class="bra-list-item" href="#">
    <div class="bra-list-thumb">
      <img src="【関連記事2のサムネイルURL】" alt="">
    </div>
    <div class="bra-list-body">
      <p class="bra-list-title">【関連記事2のタイトル】</p>
      <p class="bra-list-excerpt">【関連記事2の抜粋】</p>
    </div>
  </a>
</div>

</div>
